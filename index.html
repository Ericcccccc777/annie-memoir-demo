<style>
/* 一句主张：像翻开一本安静的书，所有工具都写在纸上。
   版式：书房的书桌。页面是纸，通话是采访稿，话费是账页，成书是真的一页页翻。
   只做浅色：这是一个纸的世界，书页在任何主题下都是纸。 */
:root {
  --desk: #f4f1e9; --paper: #fbf9f3; --sheet: #fdfbf5; --rule: #ddd6c7; --rule-soft: #e9e4d8;
  --ink: #26231e; --soft: #6b6458; --clay: #b4552e; --clay-deep: #8f3f20; --soil: #4a3626; --cloth: #5c3a26; --on-clay: #fbf9f3;
  --serif: "Newsreader", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --zh: "Noto Serif SC", "Songti SC", "STSong", "Newsreader", Georgia, serif;
  --text: "EB Garamond", "Noto Serif SC", "Songti SC", Georgia, serif;
  --display: "Libre Caslon Display", "Noto Serif SC", "Songti SC", Georgia, serif;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { background: var(--desk); color: var(--ink); font: 18px/1.65 var(--serif); margin: 0;
  padding-block: 0 56px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; font-feature-settings: "liga", "onum", "kern"; }
.wrap { max-width: 1080px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 28px; padding-block: 22px 12px; border-bottom: 1px solid var(--rule); margin-bottom: 34px; }
.brand { font-size: 23px; letter-spacing: .01em; }
nav { display: flex; flex-wrap: wrap; gap: 4px 26px; }
nav a { color: var(--soft); text-decoration: none; padding-bottom: 3px; border-bottom: 1px solid transparent; }
nav a:hover { color: var(--ink); }
nav a[aria-current="page"] { color: var(--clay-deep); border-bottom-color: var(--clay); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
h1 { font-size: clamp(34px, 5vw, 48px); line-height: 1.14; font-weight: 400; margin: 0 0 10px; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 24px; line-height: 1.25; font-weight: 400; margin: 0 0 12px; }
.lede { color: var(--soft); font-size: 20px; line-height: 1.5; margin: 0 0 38px; max-width: 34em; }
.desk { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 44px; align-items: start; }
.flyleaf { display: grid; gap: 16px; }
.clock { font-size: 44px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; font-weight: 300; }
.state { color: var(--soft); }
.state.live { color: var(--clay-deep); }
.lang { display: flex; gap: 22px; }
.lang button { white-space: nowrap; border: 0; background: none; padding: 0 0 2px; font: inherit; color: var(--soft); cursor: pointer; border-bottom: 1px solid transparent; }
.lang button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--clay); }
.lang button:disabled { cursor: default; }
.field { display: grid; min-width: 0; }
.field label { color: var(--soft); font-size: 16px; }
.field input, .field select { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 2px 0 4px; width: 100%; min-width: 0; border-radius: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.btn { font: inherit; white-space: nowrap; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--rule-soft); }
.btn.go { background: var(--clay); border-color: var(--clay); color: var(--on-clay); }
.btn.go:hover:not(:disabled) { background: var(--clay-deep); border-color: var(--clay-deep); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.quiet { border-color: var(--rule); color: var(--soft); }
.actions { display: grid; gap: 10px; }
.page { background: var(--paper); border: 1px solid var(--rule-soft); border-radius: 4px; box-shadow: 0 1px 0 var(--rule-soft), 0 18px 40px -30px rgba(74, 54, 38, .35); min-width: 0; }
.line { display: flex; flex-direction: column; min-height: 560px; }
.log { padding: 34px clamp(20px, 5vw, 52px) 20px; display: flex; flex-direction: column; gap: 18px; flex: 1; overflow-y: auto; max-height: 62vh; min-height: 400px; }
.say { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.say .who { color: var(--soft); font-style: italic; }
.say.annie .who { color: var(--clay-deep); }
.note { color: var(--soft); font-style: italic; margin: 0; }
.note.err { color: var(--clay-deep); font-style: normal; }
.opening { max-width: 30em; }
.compose { display: flex; gap: 12px; padding: 14px clamp(20px, 5vw, 52px) 20px; border-top: 1px solid var(--rule-soft); align-items: end; }
.compose textarea { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 0; padding: 6px 0; resize: none; }
.compose textarea:focus { outline: none; }
.voice-note { font-size: 16px; line-height: 1.45; }
.voice-note:empty { display: none; }
.linkish { justify-self: start; border: 0; background: none; padding: 0; font: inherit; font-size: 16px; color: var(--clay-deep); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkish:disabled { color: var(--soft); text-decoration: none; cursor: default; }
.linkish[hidden] { display: none; }
.state.listening::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--clay); margin-right: 8px; animation: hear 1.4s ease-in-out infinite; }
@keyframes hear { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .state.listening::before { animation: none; } }
.ledger { margin-top: 44px; padding: clamp(24px, 5vw, 48px) clamp(20px, 6vw, 64px); }
.ledger .tag { color: var(--soft); font-style: italic; }
.row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; }
.row .dots { flex: 1; border-bottom: 1px dotted var(--soft); transform: translateY(-5px); min-width: 16px; }
.row .amt { font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.row.total { font-size: 25px; padding-top: 16px; }
.sub { color: var(--soft); font-size: 16px; margin: -4px 0 6px; }
.alt { display: flex; flex-wrap: wrap; gap: 4px 28px; color: var(--soft); }
.alt span b { font-weight: 400; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.fine { color: var(--soft); font-size: 16px; line-height: 1.5; margin: 22px 0 0; max-width: 38em; }
details { margin-top: 18px; } summary { cursor: pointer; color: var(--clay-deep); }
details pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.55 var(--serif); margin: 10px 0 0; }
.wren-line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 22px; }
.rules { columns: 2 340px; column-gap: 56px; }
.group { break-inside: avoid; margin-bottom: 40px; }
.group ul { margin: 0; padding: 0; list-style: none; }
.group li { padding: 7px 0; border-top: 1px solid var(--rule-soft); line-height: 1.5; }
.calls { width: 100%; border-collapse: collapse; min-width: 640px; }
.scroll { overflow-x: auto; margin-bottom: 30px; }
.calls td, .calls th { padding: 9px 18px 9px 0; border-top: 1px solid var(--rule-soft); text-align: left; vertical-align: top; font-weight: 400; line-height: 1.45; }
.calls th { color: var(--soft); border-top: 0; }
.flow { list-style: none; margin: 0 0 50px; padding: 0; }
.flow > li { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 20px; padding: 22px 0; border-top: 1px solid var(--rule); }
.flow .when { color: var(--soft); font-style: italic; }
.flow h2 { margin-bottom: 2px; }
.flow .who { color: var(--clay-deep); font-style: italic; font-size: 16px; margin-left: 10px; }
.flow p { margin: 0 0 8px; color: var(--soft); }
.flow ul { margin: 0; padding-left: 20px; }

/* 封面方案：把书当实物摆出来 */
.covers { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 44px 36px; margin-bottom: 64px; }
.pick { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; display: grid; gap: 16px; align-content: start; }
.pick b { font-weight: 400; font-size: 21px; display: block; }
.pick .say { color: var(--soft); line-height: 1.45; display: block; }
.pick[aria-pressed="true"] b { color: var(--clay-deep); }
.bk { perspective: 1600px; padding: 6px 12px 22px 30px; position: relative; }
.bk3d { position: relative; aspect-ratio: 2 / 3; transform-style: preserve-3d; transform: rotateY(26deg); transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.pick:hover .bk3d, .pick[aria-pressed="true"] .bk3d { transform: rotateY(10deg); }
.bk-front { position: absolute; inset: 0; overflow: hidden; box-shadow: 22px 26px 40px -22px rgba(40, 26, 14, .6), 2px 3px 8px rgba(40, 26, 14, .25); }
.bk-front::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.2) 0, rgba(255,255,255,.14) 1.1%, rgba(255,255,255,.02) 2.6%, rgba(0,0,0,.16) 3.8%, rgba(0,0,0,0) 6%), linear-gradient(112deg, rgba(255,255,255,.1), rgba(255,255,255,0) 34%, rgba(0,0,0,.05)); }
.bk-spine { position: absolute; top: 0; bottom: 0; width: var(--sp, 18px); right: 100%; transform-origin: right center; transform: rotateY(-90deg); overflow: hidden; filter: brightness(.82); }
.sc-in { width: 540px; height: 810px; transform-origin: top left; position: absolute; left: 0; top: 0; }
.spine-in { width: 46px; height: 810px; transform-origin: top left; position: absolute; left: 0; top: 0; }
.spine { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; writing-mode: vertical-rl; padding: 36px 0; font-family: var(--display); font-size: 25px; letter-spacing: .13em; white-space: nowrap; line-height: 46px; text-transform: uppercase; }
.spine i { font-style: normal; font-size: 18px; letter-spacing: .16em; }
.jacket-wrap h2 { margin-bottom: 4px; }
.jacket-wrap .lede { margin-bottom: 22px; font-size: 18px; }
.jacket-box { position: relative; overflow: hidden; box-shadow: 0 30px 50px -30px rgba(40, 26, 14, .6), 0 2px 6px rgba(40, 26, 14, .2); }
.jacket { display: flex; width: 1126px; height: 810px; transform-origin: top left; position: absolute; left: 0; top: 0; }
.jacket > div { position: relative; flex: none; height: 810px; overflow: hidden; }
.jacket .jb, .jacket .jf { width: 540px; }
.jacket .js { width: 46px; box-shadow: inset 1px 0 0 rgba(0,0,0,.14), inset -1px 0 0 rgba(0,0,0,.14); }
.open-row { margin-top: 22px; }
/* 封面本身：字撑满书封，字距拉开，作者名和书名一样大 */
.cv { position: absolute; inset: 0; overflow: hidden; font-family: var(--display); text-transform: uppercase; }
.cv .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cv .c { position: absolute; left: 0; right: 0; text-align: center; }
.cv-evening { background: #e6b79e; color: #2a1914; }
.cv-evening .t { top: 50px; font-size: 77px; line-height: 1.07; letter-spacing: .05em; padding-left: .05em; }
.cv-evening .m { top: 232px; font-size: 19px; letter-spacing: .4em; padding-left: .4em; }
.cv-evening .a { bottom: 42px; font-size: 45px; letter-spacing: .2em; padding-left: .2em; color: #fbf0e3; text-shadow: 0 1px 14px rgba(70, 40, 25, .35); }
.cv-face { background: #2a1c14; color: #f7ecd9; }
.cv-face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,20,14,.34), rgba(30,20,14,0) 20%, rgba(30,20,14,0) 74%, rgba(30,20,14,.62)); }
.cv-face .a { z-index: 1; top: 36px; font-size: 66px; letter-spacing: .12em; padding-left: .12em; }
.cv-face .t { z-index: 1; bottom: 42px; font-size: 35px; letter-spacing: .15em; padding-left: .15em; }
.cv-plate { background: #1d332c; color: #2a2118; }
.cv-plate .dish { position: absolute; left: 50%; top: 50%; width: 742px; height: 742px; margin: -371px 0 0 -371px; border-radius: 50%; background: url(images/plate-gilt.jpg) center / cover; box-shadow: 0 34px 60px -8px rgba(0, 0, 0, .6); }
.cv-plate .t { top: 286px; font-size: 53px; line-height: 1.14; letter-spacing: .06em; padding-left: .06em; }
.cv-plate .a { top: 446px; font-size: 25px; letter-spacing: .26em; padding-left: .26em; }
.cv-type { background: #f0e8d8 url(images/paper.jpg); background-blend-mode: multiply; color: #1e1915; display: flex; flex-direction: column; justify-content: space-between; padding: 58px 46px 62px; }
.cv-type .ln { display: flex; justify-content: space-between; line-height: 1; }
.cv-type .ln .w { width: .34em; }
.cv-type .hi { color: #a4361c; }
.cv-type.zh { font-weight: 500; }
/* 封底 */
.bc { position: absolute; inset: 0; padding: 92px 60px 0; font-family: var(--text); background-blend-mode: multiply; }
.bc q { display: block; quotes: none; font-family: var(--display); font-size: 42px; line-height: 1.18; }
.bc p { font-size: 21px; line-height: 29px; margin: 34px 0 0; hyphens: none; }
.bc .ed { position: absolute; left: 60px; bottom: 50px; font-size: 17px; letter-spacing: .14em; font-variant-caps: all-small-caps; }

/* 书：6×9 英寸商业精装的比例。正文 EB Garamond，压在 26px 基线网格上，只用黑墨 */
.shelf { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-bottom: 22px; align-items: baseline; }
.reader { background: #231e19; box-shadow: 0 0 0 100vmax #231e19; clip-path: inset(0 -100vmax); padding: 34px 0 26px; margin-bottom: -56px; }
.stage { position: relative; display: flex; justify-content: center; perspective: 2400px; user-select: none; }
.spread { position: relative; display: flex; transform-origin: top center; }
.slot { position: relative; overflow: hidden; }
.slot.left.frame { overflow: visible; box-shadow: -1px 0 0 #dcd2bf, -2px 0 0 #bdb29e, -3px 0 0 #e2d9c7, -4px 0 0 #b8ad98, -5px 0 0 #d9cfbb, 0 26px 50px -20px rgba(0, 0, 0, .7); }
.slot.right.frame { overflow: visible; box-shadow: 1px 0 0 #dcd2bf, 2px 0 0 #bdb29e, 3px 0 0 #e2d9c7, 4px 0 0 #b8ad98, 5px 0 0 #d9cfbb, 0 26px 50px -20px rgba(0, 0, 0, .7); }
.single .slot.frame { box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .7); }
.sheet { width: 540px; height: 810px; overflow: hidden; background: #f9f4e8 url(images/paper.jpg); background-blend-mode: multiply; color: #211c17; position: relative; font: 400 19.5px/26px var(--text); hyphens: auto; font-feature-settings: "liga", "kern", "onum"; }
.book.zh .sheet { font: 400 17.5px/28px var(--zh); hyphens: none; }
.book.big .sheet { font-size: 23px; line-height: 30px; }
.sheet::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.sheet.recto::after { background: linear-gradient(90deg, rgba(48, 32, 18, .2), rgba(48, 32, 18, .05) 4%, rgba(48, 32, 18, 0) 11%); }
.sheet.verso::after { background: linear-gradient(270deg, rgba(48, 32, 18, .2), rgba(48, 32, 18, .05) 4%, rgba(48, 32, 18, 0) 11%); }
.sheet.nog::after { display: none; }
.ghost { width: 540px; height: 810px; }
.rh { position: absolute; top: 46px; left: 56px; width: 406px; display: flex; gap: 18px; font-size: 17px; line-height: 20px; letter-spacing: .1em; font-variant-caps: all-small-caps; color: #4d453b; white-space: nowrap; overflow: hidden; }
.verso .rh { left: 78px; }
.recto .rh { justify-content: flex-end; }
.rh .f { color: #211c17; letter-spacing: 0; font-variant-caps: normal; }
.book.zh .rh { font-size: 13.5px; letter-spacing: .08em; }
.foot { position: absolute; top: 738px; left: 56px; width: 406px; text-align: center; font-size: 16px; line-height: 20px; color: #4d453b; }
.body { position: absolute; top: 84px; left: 56px; width: 406px; height: 624px; overflow: hidden; }
.verso .body { left: 78px; }
.book.zh .body { height: 616px; }
.book.big .body { height: 630px; }
.body p { margin: 0; text-indent: 1.25em; text-align: justify; }
.book.zh .body p { text-indent: 2em; }
.body p.first, .body p.cont, .body .gap + p, .book.zh .body p.cont { text-indent: 0; }
.book.zh .body p.first, .book.zh .body .gap + p { text-indent: 2em; }
.body p.cut { text-align-last: justify; }
.body h3 { font: italic 400 21px/26px var(--text); margin: 26px 0 0; }
.body h3:first-child { margin-top: 0; }
.body .gap { height: 26px; }
.book.zh .body .gap { height: 28px; }
.book.big .body .gap { height: 30px; }
.verso .hd, .verso .foot { left: 78px; }
.hd { position: absolute; top: 84px; left: 56px; width: 406px; height: 284px; display: flex; flex-direction: column; justify-content: flex-end; }
.hd .num { font-size: 16px; line-height: 20px; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 16px; color: #4d453b; }
.book.zh .hd .num { letter-spacing: .2em; font-size: 14.5px; }
.hd h2 { font: 400 40px/46px var(--display); margin: 0; hyphens: none; text-wrap: balance; }
.book.zh .hd h2 { font: 500 31px/42px var(--zh); }
.opener .body { top: 396px; height: 312px; }
.book.zh .opener .body { top: 392px; height: 308px; }
.book.big .opener .body { top: 396px; height: 300px; }
.opener p.first::first-letter { font-family: var(--display); -webkit-initial-letter: 3; initial-letter: 3; margin-right: 7px; }
.book.zh .opener p.first::first-letter { font: inherit; -webkit-initial-letter: normal; initial-letter: normal; margin: 0; }
.sc { font-variant-caps: all-small-caps; letter-spacing: .07em; }
.pic img { position: absolute; left: 0; top: 0; width: 100%; height: 368px; object-fit: cover; object-position: 50% 34%; display: block; filter: grayscale(1) sepia(.16) contrast(1.05); mix-blend-mode: multiply; }
.pic .cap { position: absolute; top: 392px; left: 78px; width: 384px; margin: 0; font-size: 17.5px; line-height: 24px; font-style: italic; color: #4d453b; hyphens: none; }
.recto .pic .cap { left: 56px; }
.book.zh .pic .cap, .book.zh .dd, .book.zh .body h3 { font-style: normal; }
.full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 26%; display: block; filter: grayscale(1) sepia(.2) contrast(1.02); mix-blend-mode: multiply; }
.endp { position: absolute; inset: 0; background-image: url(images/paper.jpg); background-blend-mode: multiply; }
.ht, .tp, .dd { position: absolute; left: 56px; width: 406px; text-align: center; hyphens: none; }
.ht { top: 230px; font-family: var(--display); font-size: 21px; letter-spacing: .2em; text-transform: uppercase; }
.tp { top: 196px; }
.tp .t { font-family: var(--display); font-size: 54px; line-height: 1.12; letter-spacing: .05em; text-transform: uppercase; }
.tp .a { font-family: var(--display); font-size: 25px; letter-spacing: .22em; text-transform: uppercase; margin-top: 54px; }
.tp .p { position: absolute; top: 470px; left: 0; right: 0; font-size: 18px; letter-spacing: .14em; font-variant-caps: all-small-caps; color: #4d453b; }
.book.zh .tp .t { font-size: 44px; line-height: 1.3; letter-spacing: .08em; font-weight: 500; }
.dd { top: 232px; font-style: italic; font-size: 23px; line-height: 33px; }
.cp { position: absolute; left: 78px; right: 78px; bottom: 96px; font-size: 16px; line-height: 21px; hyphens: none; }
.cp p { margin: 0 0 12px; }
.toc { position: absolute; top: 150px; left: 56px; width: 406px; hyphens: none; }
.toc h2 { font: 400 22px/26px var(--display); letter-spacing: .24em; text-transform: uppercase; margin: 0 0 42px; }
.toc .row { display: flex; justify-content: space-between; gap: 20px; font-size: 20px; line-height: 36px; }
.turn { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 24px; color: #cdc1af; }
.turn .btn.quiet { color: #cdc1af; border-color: #5b5046; }
.turn .btn.quiet:hover:not(:disabled) { background: #3a322b; }
.turn .at { min-width: 8em; text-align: center; font-variant-numeric: lining-nums; }
.leaf { position: absolute; top: 0; width: 50%; height: 100%; transform-style: preserve-3d; z-index: 5; }
.leaf .side { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; }
.leaf .back { transform: rotateY(180deg); }
.hit { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3; cursor: pointer; background: none; border: 0; padding: 0; }
.hit.l { left: 0; } .hit.r { right: 0; }

.film { position: fixed; inset: 0; z-index: 30; background: #17110c; color: #f6eadb; overflow: hidden; font-family: var(--serif); }
.scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; pointer-events: none; }
.scene.on { opacity: 1; }
.scene img { position: absolute; left: 0; top: 0; width: 100%; height: 74%; object-fit: cover; object-position: 50% 32%; transform-origin: 50% 30%; }
.scene.on img { animation: drift 16s ease-out forwards; }
.scene.alt.on img { animation-name: drift2; }
@keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.12) translate(-1.2%, -1.2%); } }
@keyframes drift2 { from { transform: scale(1.12) translate(1.2%, 1%); } to { transform: scale(1.02); } }
.scene .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,17,12,0) 42%, rgba(23,17,12,.72) 62%, #17110c 73%); }
.scene .words { position: absolute; left: max(6vw, 24px); right: max(6vw, 24px); bottom: 13vh; max-width: 22em; font-size: clamp(25px, 3.2vw, 44px); line-height: 1.18; letter-spacing: -.012em; font-weight: 300; }
.scene .words p { margin: 0 0 .5em; opacity: 0; transform: translateY(10px); }

.scene.on .words p:nth-child(2) { animation-delay: 2.1s; }
.scene.on .words p:nth-child(3) { animation-delay: 4.2s; }
@keyframes rise { to { opacity: 1; transform: none; } }
.scene.paper { background: #f3ebdc; color: #2b211a; }
.scene.paper .words { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -54%); width: min(86vw, 15em); max-width: none; font-size: clamp(30px, 4.4vw, 60px); text-align: center; }

.scene.title .words { font-size: clamp(46px, 6.2vw, 92px); line-height: 1; bottom: 26vh; max-width: 6.2em; text-wrap: balance; }
@media (max-width: 620px) { .scene.title img { width: 100%; height: 66%; } .scene.title .veil { background: linear-gradient(180deg, rgba(23,17,12,0) 36%, #17110c 66%); } .scene.title .words { bottom: 15vh; } }
.scene .kicker { font-size: .34em; font-style: italic; letter-spacing: 0; }

.film-hit { position: absolute; top: 0; bottom: 92px; width: 50%; background: none; border: 0; padding: 0; cursor: pointer; }

.film { --line: #f6eadb; transition: color .9s ease; }

@media (max-width: 620px) { .life button { display: none; font-size: 15px; } .life button.cur { display: block; } .life { right: 96px; } .scene .words { bottom: 17vh; } }

@media (max-width: 860px) { .desk { grid-template-columns: minmax(0, 1fr); gap: 30px; } .flow > li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .say { grid-template-columns: minmax(0, 1fr); gap: 0; } .log { max-height: 56vh; } }
